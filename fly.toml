app = "ps5pro-watcher"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.watcher"

[env]
  WATCH_TZ = "Europe/Berlin"
  WATCH_DATA_DIR = "/data"
  WATCH_SHADOW = "1"
  WATCH_SHADOW_HOURS = "48"
  WATCH_SHOPS = "PS Direct DE,PS Direct AT,Alternate DE"
  WATCH_TAKT = "15"
  WATCH_TAKT_NEBEN = "30"
  WATCH_MAX_PREIS = "900"

# Worker ohne HTTP-Dienst: nach einem Host-Neustart oder Exit immer wieder
# starten. Fly deployt sonst standardmaessig nur bei Fehlern mit begrenzten
# Retries.
[[restart]]
  policy = "always"

[[mounts]]
  source = "watcher_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
