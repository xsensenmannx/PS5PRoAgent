
          restore-keys: |
            buildozer-${{ runner.os }}-

      # sdkmanager fragt interaktiv nach den SDK-Lizenzen; buildozers pexpect-Automatik
      # bleibt dabei schon mal minutenlang stehen. Mit hinterlegten Lizenzen im
      # SDK-Ordner wird gar nicht erst gefragt - die Automatik ist nur Rueckfallnetz.
      - name: Android-Lizenzen vorab akzeptieren
        run: |
          set -euo pipefail
          LIC="$HOME/.buildozer/android/platform/android-sdk/licenses"
          mkdir -p "$LIC"
          printf '%s\n' \
            8933bad161af4178b1185d1a37fbf41ea5269c55 \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            24333f8a63b6825ea9c5514f83c2829b004d1fee > "$LIC/android-sdk-license"
          printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd > "$LIC/android-sdk-preview-license"
          printf '%s\n' 601085b94cd77f0b54ff86406957099ebe79c4d6 > "$LIC/android-googletv-license"
          ls -l "$LIC"

      - name: APK bauen
        timeout-minutes: 60
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$HOME/.local/bin:$PATH"
