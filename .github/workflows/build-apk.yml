name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - main.py
      - scan_core.py
      - service.py
      - buildozer.spec
      - icon.png
      - "assets/**"
      - "tools/**"
      - .github/workflows/build-apk.yml

# Bei mehreren Commits kurz hintereinander (z. B. Web-Upload) nur den neuesten bauen.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Fest auf 24.04 statt ubuntu-latest: der Label wandert ab Oktober 2026 auf
    # Ubuntu 26, und ein Toolchain-Wechsel mitten im Projekt soll nicht unbemerkt
    # passieren. 24.04 ist die LTS, auf der SDK/NDK/Java 17 erprobt sind.
    runs-on: ubuntu-24.04
    # Zwei Architekturen, Python + Kivy + SDL2 ab Quellcode: der erste Lauf
    # braucht realistisch 60-100 Minuten. GitHub kappt bei 360.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Logiktests
        run: python tools/selftest.py

      - name: Kivy-Smoke-Test
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              xvfb python3-venv libgl1 libgl1-mesa-dri libglu1-mesa libegl1 libgles2 libmtdev1
            # Bewusst das System-Python fuer den UI-Smoke: Der App-Build selbst
            # wird mit dem gepinnten Python 3.11.9 gebaut und getestet.
            /usr/bin/python3 -m venv /tmp/ps5pro-kivy
            /tmp/ps5pro-kivy/bin/pip install --quiet "kivy[base]==2.3.1"
            xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render -noreset" \
              /tmp/ps5pro-kivy/bin/python tools/kivy_smoke.py
          } 2>&1 | tee /tmp/kivy-smoke.log

      - name: Kivy-Fehlerdiagnose
        if: failure()
        run: |
          set +e
          test -f /tmp/kivy-smoke.log && tail -80 /tmp/kivy-smoke.log
          test -f /tmp/kivy-smoke.log && echo "::error::$(tail -1 /tmp/kivy-smoke.log)"

      - name: Build-Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          # Image im Schluessel: p4a legt Host-Python und Werkzeuge als fertige
          # Binaries ab. Ein Cache von Ubuntu 26 laesst sich auf 24.04 nicht
          # starten (GLIBC-Version) - der Build bricht dann nach Minuten ab.
          # Bei Wechsel von runs-on diesen Wert mitziehen.
          key: buildozer-v5-ubuntu2404-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v5-ubuntu2404-

      - name: APK bauen
        timeout-minutes: 120
        run: bash tools/ci_build.sh

      - name: APK als Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ps5pro-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Fehlerbericht in die Zusammenfassung
        if: failure()
        # Nicht die letzten 60 Zeilen (das ist nur der ENVIRONMENT-Block von
        # buildozer), sondern die erste echte Fehlerzeile mit Kontext.
        run: |
          {
            echo "## Build fehlgeschlagen"
            echo ""
            echo '```'
            bash tools/ci_log_failure.sh buildozer.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log bei Fehler
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore
