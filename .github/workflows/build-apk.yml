name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - main.py
      - buildozer.spec
      - icon.png
      - "assets/**"
      - "tools/**"
      - .github/workflows/build-apk.yml

# Bei mehreren Commits kurz hintereinander (z. B. Web-Upload) nur den neuesten bauen.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Fest auf 24.04 statt ubuntu-latest: der Label wandert ab Oktober 2026 auf
    # Ubuntu 26, und ein Toolchain-Wechsel mitten im Projekt soll nicht unbemerkt
    # passieren. 24.04 ist die LTS, auf der SDK/NDK/Java 17 erprobt sind.
    runs-on: ubuntu-24.04
    # Zwei Architekturen, Python + Kivy + SDL2 ab Quellcode: der erste Lauf
    # braucht realistisch 60-100 Minuten. GitHub kappt bei 360.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Logiktests
        run: python3 tools/selftest.py

      - name: Build-Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v4-${{ runner.os }}-

      - name: APK bauen
        timeout-minutes: 120
        run: bash tools/ci_build.sh

      - name: APK als Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ps5pro-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Fehlerbericht in die Zusammenfassung
        if: failure()
        # Nicht die letzten 60 Zeilen (das ist nur der ENVIRONMENT-Block von
        # buildozer), sondern die erste echte Fehlerzeile mit Kontext.
        run: |
          {
            echo "## Build fehlgeschlagen"
            echo ""
            echo '```'
            bash tools/ci_log_failure.sh buildozer.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log bei Fehler
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore
