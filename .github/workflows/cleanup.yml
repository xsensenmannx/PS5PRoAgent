name: Repository aufraeumen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Releases, Tags und alte CI-Reste loeschen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/github_cleanup.py
