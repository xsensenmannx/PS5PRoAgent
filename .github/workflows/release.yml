# Baut bei einem Tag (z. B. v1.0) die APK und haengt sie an das Release.
# Der Download-Link ist danach ohne GitHub-Login auf dem Handy zu oeffnen.
# Die eigentliche Arbeit steckt wie im Build-Workflow in tools/ci_build.sh.
name: Release

on:
  push:
    tags: ["v*"]

# Releases anlegen und Assets hochladen braucht Schreibrechte auf contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Erster Lauf inkl. SDK/NDK realistisch 60-100 Minuten, GitHub kappt bei 360.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Logiktests
        run: python3 tools/selftest.py

      - name: Build-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v4-${{ runner.os }}-

      - name: APK bauen
        timeout-minutes: 120
        run: bash tools/ci_build.sh

      - name: APK ans Release haengen
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          fail_on_unmatched_files: true
