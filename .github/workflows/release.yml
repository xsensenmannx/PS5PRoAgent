# Baut bei einem Tag (z. B. v5.0) die APK und haengt sie an das Release.
# Der Download-Link ist danach ohne GitHub-Login auf dem Handy zu oeffnen.
# Die eigentliche Arbeit steckt in tools/ci_build.sh.
name: Release

on:
  push:
    tags: ["v*"]

# Releases anlegen und Assets hochladen braucht Schreibrechte auf contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Fester Runner: reproduzierbar, kein Wechsel auf Ubuntu 26 durch das
    # bewegliche ubuntu-latest-Label.
    runs-on: ubuntu-24.04
    # Erster Lauf inkl. SDK/NDK realistisch 60-100 Minuten, GitHub kappt bei 360.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Shop-Konfiguration pruefen
        run: python tools/validate_shop_config.py

      - name: Logiktests
        run: python tools/selftest.py

      - name: Kivy-Smoke-Test
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              xvfb python3-venv libgl1 libgl1-mesa-dri libglu1-mesa libegl1 libgles2 libmtdev1
            # Bewusst das System-Python fuer den UI-Smoke: Der App-Build selbst
            # wird mit dem gepinnten Python 3.11.9 gebaut und getestet.
            /usr/bin/python3 -m venv /tmp/ps5pro-kivy
            /tmp/ps5pro-kivy/bin/pip install --quiet "kivy[base]==2.3.1"
            xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render -noreset" \
              /tmp/ps5pro-kivy/bin/python tools/kivy_smoke.py
          } 2>&1 | tee /tmp/kivy-smoke.log

      - name: Kivy-Fehlerdiagnose
        if: failure()
        run: |
          set +e
          test -f /tmp/kivy-smoke.log && tail -80 /tmp/kivy-smoke.log
          test -f /tmp/kivy-smoke.log && echo "::error::$(tail -1 /tmp/kivy-smoke.log)"

      - name: Build-Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          # Image im Schluessel: p4a legt Host-Python und Werkzeuge als fertige
          # Binaries ab. Ein Cache von Ubuntu 26 laesst sich auf 24.04 nicht
          # starten (GLIBC-Version) - der Build bricht dann nach Minuten ab.
          # Bei Wechsel von runs-on diesen Wert mitziehen.
          key: buildozer-v5-ubuntu2404-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v5-ubuntu2404-

      - name: APK bauen
        timeout-minutes: 120
        run: bash tools/ci_build.sh

      - name: APK-Manifest mit aapt2 pruefen
        run: |
          set -euo pipefail
          APK=$(ls -1 bin/*.apk 2>/dev/null | head -n 1 || true)
          bash tools/ci_check_apk_aapt2.sh "$APK"

      - name: APK ans Release haengen
        uses: softprops/action-gh-release@v3
        with:
          files: bin/*.apk
          # Ein erneuter Tag-Lauf soll das vorhandene Asset ersetzen, statt
          # mit "asset already exists" abzubrechen.
          overwrite_files: true
          fail_on_unmatched_files: true
