# Baut das Debug-APK und die Windows-EXE der Offline-Hilfe (support_app/).
#
# Bewusst getrennt von release.yml und play-aab.yml: Die Radar-App und ihre
# Releases bleiben unberuehrt. Bei einem Tag hilfe-v1.2.3 entsteht ein Release
# mit APK und EXE an derselben Stelle.
name: Support APK

on:
  workflow_dispatch:
  push:
    # Tag-Push hilfe-v1.2.3 baut APK und EXE und legt automatisch ein Release an.
    # Bei Tag-Pushes wertet GitHub paths-Filter nicht aus, der Build laeuft also
    # immer; Branch-Pushes bleiben auf support_app/ beschraenkt.
    tags:
      - "hilfe-v*"
    # Ohne branches wuerde ein tags-Filter Branch-Pushes komplett abschalten.
    branches: ["**"]
    paths:
      - "support_app/**"
      - ".github/workflows/support-apk.yml"

# Release anlegen und Dateien hochladen braucht Schreibrechte auf contents.
# Gilt nur fuer diesen Workflow; release.yml (Radar) bleibt unberuehrt.
permissions:
  contents: write

jobs:
  apk:
    name: Android-APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      # Tag hilfe-v1.2.3 -> version=1.2.3, versionCode=10203. Das Skript ist
      # dasselbe wie im Radar-Release; nur der Tag-Praefix wird abgeschnitten.
      - name: Version aus Tag
        if: startsWith(github.ref, 'refs/tags/hilfe-v')
        run: |
          set -euo pipefail
          bash tools/set_version_from_tag.sh "v${GITHUB_REF_NAME#hilfe-v}" \
            support_app/buildozer.spec
          grep -E '^(version|android\.numeric_version)' support_app/buildozer.spec

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      # Der Kern ist Kivy-frei, die Tests laufen in Sekunden und brauchen kein SDK.
      - name: Kerntests
        run: python -m unittest discover -s support_app/tests -v

      # Wie in tools/ci_build.sh: ohne libtool/autoconf scheitert das
      # libffi-Recipe von p4a an "possibly undefined macro: LT_SYS_SYMBOL_USCORE".
      - name: Systempakete
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev liblzma-dev cmake unzip zip \
            ccache git libltdl-dev
          sudo apt-get install -y -qq --no-install-recommends aidl || true

      - name: Buildozer installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "git+https://github.com/kivy/buildozer" "cython==0.29.37" legacy-cgi

      - name: Build-Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            support_app/.buildozer
          key: support-buildozer-v2-${{ hashFiles('support_app/buildozer.spec') }}
          restore-keys: support-buildozer-v2-

      - name: APK bauen
        working-directory: support_app
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONUTF8: "1"
          # Neutralisiert p4as "pip install -U pip" im Build-venv (p4a #3339).
          PIP_CONSTRAINT: ${{ github.workspace }}/support_app/pip-constraints.txt
        run: buildozer -v android debug

      - name: Manifest pruefen
        run: |
          set -euo pipefail
          APK=$(ls -1 support_app/bin/*.apk | head -n 1)
          AAPT2=$(ls -1 "$HOME"/.buildozer/android/platform/android-sdk/build-tools/*/aapt2 | tail -n 1)
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)" || true
          "$AAPT2" dump badging "$APK" | grep -q "package: name='de.konsolenradar.support'" \
            || { echo "::error::Falsches Paket im APK"; exit 1; }
          sha256sum "$APK" | tee support_app/bin/SHA256SUMS

      - name: APK sichern
        if: always()
        # v7 laeuft auf Node 24; v4 wird von GitHub als veraltet gemeldet.
        uses: actions/upload-artifact@v7
        with:
          name: ps5pro-search-agent-hilfe-apk
          path: |
            support_app/bin/*.apk
            support_app/bin/SHA256SUMS
            support_app/buildozer.log
          # Bei einem Fehlschlag existiert oft keine APK. Der Job ist dann
          # bereits rot; eine zweite Warnung ueber fehlende Dateien hilft nie.
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows-EXE
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Gleiche Versionen wie im lokalen Windows-Build; Kivy liefert fuer
      # Windows fertige Wheels, es wird nichts kompiliert.
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kivy[base]==2.3.2" "pyinstaller==6.22.3" "pillow==11.3.0"

      - name: EXE bauen
        working-directory: support_app
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "PS5ProSearchAgent-Hilfe" --icon icon.ico main.py

      # --selftest braucht kein Fenster (siehe README); er prueft den Kern
      # im gepackten Einzeldatei-Build.
      - name: Selftest
        working-directory: support_app
        shell: pwsh
        run: |
          ./dist/PS5ProSearchAgent-Hilfe.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "Selftest fehlgeschlagen ($LASTEXITCODE)" }

      - name: EXE sichern
        uses: actions/upload-artifact@v7
        with:
          name: ps5pro-search-agent-hilfe-win
          path: support_app/dist/PS5ProSearchAgent-Hilfe.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    # Nur bei Tag-Pushes, und erst wenn beide Builds durch sind.
    if: startsWith(github.ref, 'refs/tags/hilfe-v')
    needs: [apk, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Legt je Artefakt einen Unterordner an:
      #   dist/ps5pro-search-agent-hilfe-apk/bin/*.apk
      #   dist/ps5pro-search-agent-hilfe-win/PS5ProSearchAgent-Hilfe.exe
      - name: Artefakte holen
        uses: actions/download-artifact@v8
        with:
          path: dist

      # Ein erneuter Lauf zum selben Tag ersetzt beide Dateien, statt
      # mit "asset already exists" abzubrechen.
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#hilfe-v}"
          APK=$(ls -1 dist/*/bin/*.apk | head -n 1)
          EXE=$(ls -1 dist/*/*.exe | head -n 1)
          APK_NAME=$(basename "$APK")
          EXE_NAME=$(basename "$EXE")
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          EXE_SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          APK_SIZE=$(wc -c < "$APK" | tr -d ' ')
          EXE_SIZE=$(wc -c < "$EXE" | tr -d ' ')
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## PS5 Pro Search Agent – Hilfe $VERSION

          Eigenständige Offline-Hilfe für den PS5 Pro Search Agent.
          Eigenes Paket (de.konsolenradar.support), unabhängig von der Radar-App
          und deren Releases.

          ### Android

          - Android 7.0 oder neuer, arm64-v8a und armeabi-v7a
          - Debug-signiert: „Unbekannte Quellen“ erlauben; nicht für Google Play
          - Keine Internet-Berechtigung, keine Telemetrie
          - Parallel zur Radar-App installierbar
          - \`$APK_NAME\` ($APK_SIZE Bytes)

          ### Windows

          - Portable EXE, kein Installer
          - Nicht signiert: SmartScreen warnt beim ersten Start
          - \`$EXE_NAME\` ($EXE_SIZE Bytes)

          ### Prüfsummen

          \`\`\`
          SHA-256  $APK_SHA  $APK_NAME
          SHA-256  $EXE_SHA  $EXE_NAME
          \`\`\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert - Dateien werden ersetzt"
            gh release upload "$TAG" "$APK" "$EXE" --clobber
          else
            gh release create "$TAG" "$APK" "$EXE" \
              --title "PS5 Pro Search Agent – Hilfe $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest=false
          fi
