# Baut Release-APK, Windows-EXE und AAB der Offline-Hilfe (support_app/).
#
# Bewusst getrennt von release.yml und play-aab.yml: Die Radar-App und ihre
# Releases bleiben unberuehrt. Bei einem Tag hilfe-v1.2.3 entsteht ein Release
# mit APK und EXE; das AAB wird im selben Lauf gebaut und bleibt ein Artefakt.
name: Support APK

on:
  workflow_dispatch:
  push:
    # Tag-Push hilfe-v1.2.3 baut APK, EXE und AAB und legt automatisch ein
    # Release mit APK und EXE an; das AAB bleibt Actions-Artefakt.
    # Bei Tag-Pushes wertet GitHub paths-Filter nicht aus, der Build laeuft also
    # immer; Branch-Pushes bleiben auf support_app/ beschraenkt.
    tags:
      - "hilfe-v*"
    # Ohne branches wuerde ein tags-Filter Branch-Pushes komplett abschalten.
    branches: ["**"]
    paths:
      - "support_app/**"
      - ".github/workflows/support-apk.yml"

# Release anlegen und Dateien hochladen braucht Schreibrechte auf contents.
# Gilt nur fuer diesen Workflow; release.yml (Radar) bleibt unberuehrt.
permissions:
  contents: write

jobs:
  apk:
    name: Android-APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # Signierung: eigener Release-Key, nie im Repo. Fehlen die Secrets, wird
    # bewusst kein APK gebaut (kein Debug-APK als Download). Die Secrets
    # stehen nur in den Schritten, die sie lesen - nicht im Job-env, damit
    # Checkout und Cache sie nie sehen.
    steps:
      - uses: actions/checkout@v5

      # Tag hilfe-v1.2.3 -> version=1.2.3, versionCode=10203. Das Skript ist
      # dasselbe wie im Radar-Release; es zieht die Play-Spec und version.py
      # mit, damit APK, EXE und AAB dieselbe Version tragen.
      - name: Version aus Tag
        if: startsWith(github.ref, 'refs/tags/hilfe-v')
        run: |
          set -euo pipefail
          bash tools/set_version_from_tag.sh "v${GITHUB_REF_NAME#hilfe-v}" \
            support_app/buildozer.spec
          grep -E '^(version|android\.numeric_version)' \
            support_app/buildozer.spec support_app/buildozer.play.spec

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      # Der Kern ist Kivy-frei, die Tests laufen in Sekunden und brauchen kein SDK.
      - name: Kerntests
        run: python -m unittest discover -s support_app/tests -v

      # Wie in tools/ci_build.sh: ohne libtool/autoconf scheitert das
      # libffi-Recipe von p4a an "possibly undefined macro: LT_SYS_SYMBOL_USCORE".
      - name: Systempakete
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev liblzma-dev cmake unzip zip \
            ccache git libltdl-dev
          sudo apt-get install -y -qq --no-install-recommends aidl || true

      - name: Buildozer installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "git+https://github.com/kivy/buildozer" "cython==0.29.37" legacy-cgi certifi

      - name: Build-Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            support_app/.buildozer
          key: support-buildozer-v2-${{ hashFiles('support_app/buildozer.spec') }}
          restore-keys: support-buildozer-v2-

      # Prueft nur, ob ein Keystore hinterlegt ist; das Secret liegt allein in
      # diesem Schritt. Fehlt es, bleibt der Job gruen (Notice) und es entsteht
      # kein APK.
      - name: Keystore pruefen
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.HILFE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          else
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein APK gebaut: Secret HILFE_KEYSTORE_BASE64 fehlt. Anleitung in support_app/README.md, Abschnitt Signierung."
          fi

      - name: Keystore bereitstellen
        if: steps.keystore.outputs.vorhanden == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.HILFE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.HILFE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_PASS:-}" ]; then
            echo "::error::HILFE_KEYSTORE_PASSWORD fehlt"; exit 1
          fi
          KS="$RUNNER_TEMP/hilfe-release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          keytool -list -keystore "$KS" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASS > /dev/null
          echo "Keystore in Ordnung ($(wc -c < "$KS") Bytes)"

      # Signiert wird von p4a, sobald alle vier P4A_RELEASE_*-Variablen gesetzt
      # sind; buildozer haengt dann --sign an. android.release_artifact = apk
      # sorgt fuer eine APK statt eines AAB.
      - name: APK bauen (release, signiert)
        if: steps.keystore.outputs.vorhanden == 'true'
        working-directory: support_app
        env:
          KEYSTORE_PASS: ${{ secrets.HILFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HILFE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.HILFE_KEY_PASSWORD }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONUTF8: "1"
          # Neutralisiert p4as "pip install -U pip" im Build-venv (p4a #3339).
          PIP_CONSTRAINT: ${{ github.workspace }}/support_app/pip-constraints.txt
        run: |
          set -euo pipefail
          ALIAS="${KEY_ALIAS:-hilfe}"
          KEYPASS="${KEY_PASS:-$KEYSTORE_PASS}"
          export P4A_RELEASE_KEYSTORE="$RUNNER_TEMP/hilfe-release.p12"
          export P4A_RELEASE_KEYSTORE_PASSWD="$KEYSTORE_PASS"
          export P4A_RELEASE_KEYALIAS="$ALIAS"
          export P4A_RELEASE_KEYALIAS_PASSWD="$KEYPASS"
          rm -f bin/*.apk
          buildozer -v android release
          ls -l bin/*.apk

      - name: Manifest und Signatur pruefen
        if: steps.keystore.outputs.vorhanden == 'true'
        env:
          CERT_SHA256: ${{ secrets.HILFE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=$(ls -1 support_app/bin/*.apk | head -n 1)
          AAPT2=$(ls -1 "$HOME"/.buildozer/android/platform/android-sdk/build-tools/*/aapt2 | tail -n 1)
          APKSIGNER=$(ls -1 "$HOME"/.buildozer/android/platform/android-sdk/build-tools/*/apksigner | tail -n 1)
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)" || true
          "$AAPT2" dump badging "$APK" | grep -q "package: name='de.konsolenradar.support'" \
            || { echo "::error::Falsches Paket im APK"; exit 1; }
          "$AAPT2" dump badging "$APK" | grep -q "android.permission.INTERNET" \
            || { echo "::error::INTERNET-Berechtigung fehlt"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK ist noch mit dem Debug-Zertifikat signiert"; exit 1
          fi
          CERT=$(grep -i "SHA-256 digest" "$RUNNER_TEMP/certs.txt" | head -n 1 | sed 's/.*: //')
          echo "Zertifikat SHA-256: $CERT"
          if [ -n "${CERT_SHA256:-}" ]; then
            ERWARTET=$(printf '%s' "$CERT_SHA256" | tr -d ':\r ' | tr 'A-F' 'a-f')
            IST=$(printf '%s' "$CERT" | tr -d ':\r ' | tr 'A-F' 'a-f')
            [ "$IST" = "$ERWARTET" ] \
              || { echo "::error::Signatur passt nicht zu HILFE_CERT_SHA256"; exit 1; }
          fi
          printf '%s\n' "$CERT" > support_app/bin/CERT-SHA256.txt
          sha256sum "$APK" | tee support_app/bin/SHA256SUMS

      # Die Universal-APK enthaelt arm64-v8a und armeabi-v7a. Fuer moderne
      # Geraete ist die 32-Bit-Haelfte nur Ballast; deshalb zusaetzlich eine
      # reine arm64-Fassung aus derselben APK ableiten und neu signieren.
      - name: arm64-only APK ableiten
        if: steps.keystore.outputs.vorhanden == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.HILFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HILFE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.HILFE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.HILFE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          UNIVERSAL=$(ls -1 support_app/bin/*arm64-v8a_armeabi-v7a*.apk | head -n 1)
          V8=$(printf '%s' "$UNIVERSAL" | sed 's/-arm64-v8a_armeabi-v7a-/-arm64-v8a-/')
          [ "$V8" != "$UNIVERSAL" ] \
            || { echo "::error::Name der arm64-APK nicht abgeleitet"; exit 1; }
          TOOLS=$(ls -d "$HOME"/.buildozer/android/platform/android-sdk/build-tools/* | tail -n 1)
          ARBEIT=$(mktemp -d)

          unzip -q "$UNIVERSAL" -d "$ARBEIT/app"
          rm -rf "$ARBEIT/app/lib/armeabi-v7a"
          rm -f "$ARBEIT/app"/META-INF/*.SF "$ARBEIT/app"/META-INF/*.RSA \
                "$ARBEIT/app"/META-INF/*.DSA
          # Wie im p4a-Original komprimieren (extractNativeLibs ist dort nicht
          # abgeschaltet); unkomprimiert waere die Datei groesser als noetig.
          (cd "$ARBEIT/app" && zip -qr "$ARBEIT/v8-unsigned.apk" .)
          "$TOOLS/zipalign" -f 4 "$ARBEIT/v8-unsigned.apk" "$ARBEIT/v8-aligned.apk"

          ALIAS="${KEY_ALIAS:-hilfe}"
          if [ -n "${KEY_PASS:-}" ]; then KPASS=KEY_PASS; else KPASS=KEYSTORE_PASS; fi
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/hilfe-release.p12" \
            --ks-pass env:KEYSTORE_PASS --ks-key-alias "$ALIAS" \
            --key-pass "env:$KPASS" "$ARBEIT/v8-aligned.apk"

          "$TOOLS/apksigner" verify --print-certs "$ARBEIT/v8-aligned.apk" \
            | tee "$ARBEIT/certs.txt"
          if grep -qi "Android Debug" "$ARBEIT/certs.txt"; then
            echo "::error::arm64-APK ist debug-signiert"; exit 1
          fi
          CERT=$(grep -i "SHA-256 digest" "$ARBEIT/certs.txt" | head -n 1 | sed 's/.*: //')
          if [ -n "${CERT_SHA256:-}" ]; then
            ERWARTET=$(printf '%s' "$CERT_SHA256" | tr -d ':\r ' | tr 'A-F' 'a-f')
            IST=$(printf '%s' "$CERT" | tr -d ':\r ' | tr 'A-F' 'a-f')
            [ "$IST" = "$ERWARTET" ] \
              || { echo "::error::arm64-APK passt nicht zu HILFE_CERT_SHA256"; exit 1; }
          fi
          "$TOOLS/aapt2" dump badging "$ARBEIT/v8-aligned.apk" \
            | grep -q "package: name='de.konsolenradar.support'" \
            || { echo "::error::Falsches Paket in der arm64-APK"; exit 1; }
          if unzip -l "$ARBEIT/v8-aligned.apk" | grep -q "lib/armeabi-v7a/"; then
            echo "::error::arm64-APK enthaelt noch 32-Bit-Bibliotheken"; exit 1
          fi
          unzip -l "$ARBEIT/v8-aligned.apk" | grep -q "lib/arm64-v8a/" \
            || { echo "::error::arm64-Bibliotheken fehlen"; exit 1; }

          cp "$ARBEIT/v8-aligned.apk" "$V8"
          sha256sum "$V8" >> support_app/bin/SHA256SUMS
          ls -l "$UNIVERSAL" "$V8"

      - name: APK sichern
        if: steps.keystore.outputs.vorhanden == 'true'
        # v7 laeuft auf Node 24; v4 wird von GitHub als veraltet gemeldet.
        uses: actions/upload-artifact@v7
        with:
          name: ps5pro-search-agent-hilfe-apk
          path: |
            support_app/bin/*.apk
            support_app/bin/SHA256SUMS
            support_app/bin/CERT-SHA256.txt
            support_app/buildozer.log
          # Ohne Keystore wird dieser Schritt uebersprungen; mit Keystore muss
          # die APK existieren, sonst ist der Job ohnehin rot.
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows-EXE
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Auch die EXE zeigt version.py an; beim Tag-Build muss sie dieselbe
      # Version wie APK und AAB tragen.
      - name: Version aus Tag
        if: startsWith(github.ref, 'refs/tags/hilfe-v')
        shell: bash
        run: |
          set -euo pipefail
          bash tools/set_version_from_tag.sh "v${GITHUB_REF_NAME#hilfe-v}" \
            support_app/buildozer.spec
          grep -E '^(version|android\.numeric_version)' \
            support_app/buildozer.spec support_app/buildozer.play.spec

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Gleiche Kivy-/PyInstaller-Versionen wie im lokalen Windows-Build.
      # Pillow bewusst nicht pinnen: kivy[base] 2.3.2 verlangt pillow<11 und
      # loest die passende Version selbst auf. Die App braucht Pillow nicht,
      # nur make_icon.py.
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kivy[base]==2.3.2" "pyinstaller==6.22.3" certifi

      # PyInstaller sammelt Kivy-Module per Import und loest dabei Kivys
      # Fensteraufbau aus. Der Runner hat nur OpenGL 1.1; Kivy zeigt dann eine
      # modale Messagebox und der Job haengt bis zum Timeout. Das Mock-Backend
      # ueberspringt die GL-Pruefung. Es gilt nur fuer den Build, nicht fuer die
      # gebaute EXE.
      #
      # Software-Renderer wurden geprueft (Branch gl-experiment, 2026-11-14):
      # Mesa 26.2.6/llvmpipe neben der Onedir-EXE wird nicht geladen, es bleibt
      # bei GDI/OpenGL 1.1. ANGLE (angle_sdl2) liefert GL ES 2.0 ueber D3D11
      # WARP, der Prozess stuerzt aber mit 0xC0000409 ab. Deshalb bleibt Mock.
      - name: EXE bauen
        working-directory: support_app
        env:
          KIVY_GL_BACKEND: mock
          KIVY_NO_ARGS: "1"
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "PS5ProSearchAgent-Hilfe" --icon icon.ico main.py

      # --selftest braucht kein Fenster (siehe README); er prueft den Kern
      # im gepackten Einzeldatei-Build.
      - name: Selftest
        working-directory: support_app
        shell: pwsh
        # Auch die fertige EXE baut beim Start Kivys Fenster auf; ohne Mock
        # beendet sie sich auf dem Runner wegen OpenGL 1.1.
        env:
          KIVY_GL_BACKEND: mock
          KIVY_NO_ARGS: "1"
        # PowerShell wartet bei GUI-Programmen nicht und laesst LASTEXITCODE
        # leer; Start-Process -Wait liefert den echten Exitcode der EXE.
        run: |
          $p = Start-Process -FilePath ".\dist\PS5ProSearchAgent-Hilfe.exe" `
            -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Selftest fehlgeschlagen ($($p.ExitCode))" }

      - name: EXE sichern
        uses: actions/upload-artifact@v7
        with:
          name: ps5pro-search-agent-hilfe-win
          path: support_app/dist/PS5ProSearchAgent-Hilfe.exe
          if-no-files-found: error
          retention-days: 14

  aab:
    name: Android-AAB
    # Beim Tag-Release laeuft der AAB-Build als dritter Build mit. Ein
    # manueller Start von Support APK baut ihn ebenfalls, legt aber kein
    # Release an. Bei Branch-Pushes bleibt er aus (dafuer gibt es Support AAB).
    if: startsWith(github.ref, 'refs/tags/hilfe-v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/support-aab.yml
    secrets: inherit

  release:
    name: Release
    # Nur bei Tag-Pushes, und erst wenn APK, EXE und AAB durch sind.
    if: startsWith(github.ref, 'refs/tags/hilfe-v')
    needs: [apk, windows, aab]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Nur die Release-Assets holen; das AAB wird bewusst nicht heruntergeladen
      # und damit auch nicht ans GitHub-Release angehaengt.
      #   dist/apk/bin/*.apk
      #   dist/win/PS5ProSearchAgent-Hilfe.exe
      - name: APK-Artefakt holen
        uses: actions/download-artifact@v8
        # Fehlt das Artefakt, soll die Pruefung darunter die Ursache nennen
        # statt dieser Schritt mit "Unable to find any artifacts".
        continue-on-error: true
        with:
          name: ps5pro-search-agent-hilfe-apk
          path: dist/apk

      - name: EXE-Artefakt holen
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ps5pro-search-agent-hilfe-win
          path: dist/win

      # Ohne Keystore baut der APK-Job bewusst kein APK. Dann soll der
      # Release-Job das klar benennen, statt an einem "ls: cannot access"
      # abzubrechen.
      - name: Signiertes APK pruefen
        id: artefakte
        run: |
          set -euo pipefail
          APK=$(ls -1 dist/*/bin/*arm64-v8a_armeabi-v7a*.apk 2>/dev/null | head -n 1 || true)
          V8=$(ls -1 dist/*/bin/*arm64-v8a-release.apk 2>/dev/null | head -n 1 || true)
          EXE=$(ls -1 dist/*/*.exe 2>/dev/null | head -n 1 || true)

          if [ -z "$APK" ]; then
            {
              echo "### Release abgebrochen: signiertes APK fehlt"
              echo ""
              echo "Der Android-Job hat kein APK gebaut, weil das Secret"
              echo "\`HILFE_KEYSTORE_BASE64\` nicht gesetzt ist. Ohne Keystore"
              echo "entsteht bewusst kein Debug-APK."
              echo ""
              echo "Hinterlegen unter Settings → Secrets and variables → Actions:"
              echo "\`HILFE_KEYSTORE_BASE64\` und \`HILFE_KEYSTORE_PASSWORD\`."
              echo "Anleitung: \`support_app/README.md\`, Abschnitt „Signierung (Release-APK)“."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Kein signiertes APK im Artefakt: Secret HILFE_KEYSTORE_BASE64 fehlt. Anleitung in support_app/README.md, Abschnitt Signierung. Release abgebrochen."
            exit 1
          fi

          if [ -z "$V8" ]; then
            echo "::error::Arm64-Variante fehlt im Artefakt. Der Schritt „arm64-only APK ableiten“ muss sie erzeugen. Release abgebrochen."
            exit 1
          fi

          if [ -z "$EXE" ]; then
            {
              echo "### Release abgebrochen: Windows-EXE fehlt"
              echo ""
              echo "Der Windows-Job hat keine EXE hochgeladen; siehe dessen Log."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Keine Windows-EXE im Artefakt. Release abgebrochen."
            exit 1
          fi

          echo "APK: $APK"
          echo "V8: $V8"
          echo "EXE: $EXE"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "v8=$V8" >> "$GITHUB_OUTPUT"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      # Ein erneuter Lauf zum selben Tag ersetzt beide Dateien, statt
      # mit "asset already exists" abzubrechen.
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#hilfe-v}"
          APK="${{ steps.artefakte.outputs.apk }}"
          V8="${{ steps.artefakte.outputs.v8 }}"
          EXE="${{ steps.artefakte.outputs.exe }}"
          [ -f "$APK" ] || { echo "::error::APK fehlt: $APK"; exit 1; }
          [ -f "$V8" ] || { echo "::error::arm64-APK fehlt: $V8"; exit 1; }
          [ -f "$EXE" ] || { echo "::error::EXE fehlt: $EXE"; exit 1; }
          APK_NAME=$(basename "$APK")
          V8_NAME=$(basename "$V8")
          EXE_NAME=$(basename "$EXE")
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          V8_SHA=$(sha256sum "$V8" | cut -d' ' -f1)
          EXE_SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          APK_SIZE=$(wc -c < "$APK" | tr -d ' ')
          V8_SIZE=$(wc -c < "$V8" | tr -d ' ')
          EXE_SIZE=$(wc -c < "$EXE" | tr -d ' ')
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## PS5 Pro Search Agent – Hilfe $VERSION

          Hilfe-App zum PS5 Pro Search Agent: offline nutzbar, optional mit
          eigener KI-Anbindung. Eigenes Paket (de.konsolenradar.support),
          unabhängig von der Radar-App und deren Releases.

          ### Android

          - Android 7.0 oder neuer
          - Release-signiert mit eigenem Key; Installation aus „Unbekannte Quellen“
          - Offline nutzbar; optionale KI mit eigenem Key bei Freebuff,
            OpenRouter, Groq, Google AI Studio oder Mistral
          - OpenRouter, Groq, Google AI Studio und Mistral haben kostenlose
            Kontingente; Freebuff rechnet über dein Guthaben ab
          - Keine Telemetrie, kein eingebauter Key
          - Parallel zur Radar-App installierbar
          - \`$APK_NAME\` ($APK_SIZE Bytes) — arm64-v8a und armeabi-v7a
          - \`$V8_NAME\` ($V8_SIZE Bytes) — nur arm64-v8a, kleinere Datei
          - Signatur-Zertifikat SHA-256: \`$(cat dist/*/bin/CERT-SHA256.txt 2>/dev/null | head -n 1 || echo unbekannt)\`

          ### Windows

          - Portable EXE, kein Installer
          - Nicht signiert: SmartScreen warnt beim ersten Start
          - \`$EXE_NAME\` ($EXE_SIZE Bytes)

          ### Prüfsummen

          \`\`\`
          SHA-256  $APK_SHA  $APK_NAME
          SHA-256  $V8_SHA  $V8_NAME
          SHA-256  $EXE_SHA  $EXE_NAME
          \`\`\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert - Dateien werden ersetzt"
            gh release upload "$TAG" "$APK" "$V8" "$EXE" --clobber
          else
            gh release create "$TAG" "$APK" "$V8" "$EXE" \
              --title "PS5 Pro Search Agent – Hilfe $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest=false
          fi
