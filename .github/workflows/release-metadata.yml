name: Release-Metadaten

on:
  # Einmalig beim Hinzufuegen dieser Datei: bestehende Beta-Releases korrigieren.
  push:
    branches: [main]
    paths:
      - .github/workflows/release-metadata.yml
  # Neue Releases: nach erfolgreichem Release-Lauf den Beta-Tag pruefen.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark-beta-prerelease:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Beta-Releases als Pre-release markieren
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::GitHub-Token ist leer"
            exit 1
          fi
          echo "Repository: ${REPO}"
          tags=()
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            case "$RUN_TAG" in
              *beta*) tags+=("$RUN_TAG") ;;
            esac
          else
            tags=(v1.0beta v4.0-beta v4.0-beta2)
          fi
          api="https://api.github.com/repos/${REPO}"
          for tag in "${tags[@]}"; do
            echo "Markiere $tag als Pre-release"
            code=$(curl --silent --show-error -o /tmp/releases.json -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/releases?per_page=100")
            if [ "$code" != "200" ]; then
              echo "::error::Release-Liste ${REPO}: HTTP $code"
              cat /tmp/releases.json
              exit 1
            fi
            release_id=$(jq -r --arg tag "$tag" \
              '.[] | select(.tag_name == $tag) | .id' /tmp/releases.json | head -n 1)
            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "::error::Release $tag in ${REPO} nicht gefunden"
              exit 1
            fi
            code=$(curl --silent --show-error -o /tmp/release.json -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/releases/${release_id}" \
              --data '{"prerelease":true}')
            if [ "$code" != "200" ]; then
              echo "::error::Release $tag (ID $release_id): HTTP $code"
              cat /tmp/release.json
              exit 1
            fi
          done
