# Manueller Diagnose-Lauf: sammelt in wenigen Minuten System-, Toolchain-,
# SDK/NDK- und Projekt-Status und schreibt alles in die Run-Summary.
# Start: Actions -> "Diagnose" -> Run workflow.
name: Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: System, Projekt und Spec
        run: |
          {
            echo "## Diagnose"
            echo ""
            echo "### System"
            echo '```'
            uname -srm
            python3 --version 2>&1
            java -version 2>&1 | head -2
            echo "Platz:"; df -h / | tail -1
            echo "RAM:"; free -h | head -2
            echo '```'
            echo ""
            echo "### Projektdateien"
            echo '```'
            for f in main.py buildozer.spec icon.png assets/icon_fg.png assets/icon_bg.png tools/selftest.py; do
              if [ -f "$f" ]; then echo "OK     $f"; else echo "FEHLT  $f"; fi
            done
            echo '```'
            echo ""
            echo "### buildozer.spec"
            echo '```'
            grep -E '^(version|package\.(name|domain)|requirements|android\.(api|minapi|ndk|ndk_api|archs)|p4a\.(branch|bootstrap))' buildozer.spec || echo "Spec nicht lesbar"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Buildozer-Umgebung
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### Buildozer und Python"
            echo '```'
            if ! command -v uv >/dev/null 2>&1; then
              curl -LsSf https://astral.sh/uv/install.sh | sh || echo "uv-Installation fehlgeschlagen"
            fi
            export PATH="$HOME/.local/bin:$PATH"
            echo "uv: $(uv --version 2>&1)"
            uv venv --python 3.11.9 .venv || echo "venv-Anlage fehlgeschlagen"
            uv pip install --python .venv/bin/python --upgrade pip setuptools wheel || echo "pip/setuptools/wheel fehlgeschlagen"
            uv pip install --python .venv/bin/python "git+https://github.com/kivy/buildozer" "cython==0.29.37" legacy-cgi || echo "buildozer-Installation fehlgeschlagen"
            echo ""
            echo "Python im venv: $(.venv/bin/python -V 2>&1)"
            echo "buildozer: $(.venv/bin/buildozer --version 2>&1)"
            echo ""
            .venv/bin/python -m pip list 2>/dev/null | grep -iE "buildozer|cython|python-for-android|virtualenv|legacy" || echo "(Paketliste nicht lesbar)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logiktests
        continue-on-error: true
        run: |
          {
            echo ""
            echo "### Logiktests"
            echo '```'
            python3 tools/selftest.py > /tmp/selftest.log 2>&1
            rc=$?
            tail -25 /tmp/selftest.log
            echo "Exit-Code: $rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SDK- und NDK-Cache
        run: |
          {
            echo ""
            echo "### SDK / NDK im Cache"
            echo '```'
            P="$HOME/.buildozer/android/platform"
            if [ -d "$P" ]; then
              ls -1 "$P" 2>/dev/null || true
              for ndk in "$P"/android-ndk-r*; do
                [ -d "$ndk" ] || continue
                v=$(grep -h 'Pkg.Revision' "$ndk/source.properties" 2>/dev/null | head -1)
                echo "NDK: $(basename "$ndk") ${v:-ohne source.properties}"
              done
              for sdk in "$P"/android-sdk*; do
                [ -d "$sdk" ] || continue
                if [ -f "$sdk/tools/bin/sdkmanager" ]; then
                  echo "SDK: $sdk (sdkmanager vorhanden)"
                else
                  echo "SDK: $sdk (sdkmanager FEHLT)"
                fi
              done
            else
              echo "kein Cache - der Build laedt SDK und NDK neu"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Letzter Fehler aus dem Build-Workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo ""
            echo "### Letzte Build-Laeufe"
            echo '```'
            gh run list --workflow=build-apk.yml --limit 5 2>&1 || echo "gh run list fehlgeschlagen"
            echo '```'
            id=$(gh run list --workflow=build-apk.yml --status=failure --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
            echo "Fehlgeschlagener Lauf: ${id:-keiner}"
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              rm -rf /tmp/blog
              gh run download "$id" -n buildozer-log -D /tmp/blog 2>&1 || echo "kein buildozer-log-Artifact in diesem Lauf"
              log=$(find /tmp/blog -name 'buildozer.log' -print -quit 2>/dev/null)
              if [ -n "$log" ]; then
                echo '```'
                echo "--- 40 Zeilen vor der letzten Fehlerstelle ---"
                tac "$log" | grep -B 40 -m1 'Command failed' | tac | tail -60 || true
                echo "--- letzte 25 Zeilen ---"
                tail -25 "$log"
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
